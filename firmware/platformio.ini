; CAIDEN OS - PlatformIO project
; Board: CAIDEN Smart Weather Clock (ESP8266EX, 4 MB flash, CH340C)
; Flash header of the stock image (E9 01 02 40) = DIO mode, 4 MB, 40 MHz -> match it.

[platformio]
default_envs = caiden

[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
; 4 MB: ~1 MB sketch, 2 MB LittleFS (config + album art cache), rest OTA/sys
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 115200          ; faster speeds are unreliable on this clock
; the USB port is found automatically; add upload_port = COMx (or /dev/ttyUSB0) if you have several
build_unflags = -Os
build_flags =
    -O2
    -Wall
    -DCAIDEN_FW_VERSION=\"0.8.6\"
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DARDUINOJSON_USE_DOUBLE=0

; ---- Milestone 1: hardware probe (display pins, backlight polarity, touch pad)
[env:probe]
build_src_filter = +<probe/> +<display/> +<graphics/>

; ---- CAIDEN OS
[env:caiden]
build_src_filter = +<*> -<probe/>
lib_deps =
    bblanchon/ArduinoJson@7.2.1
